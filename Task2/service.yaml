apiVersion: v1
kind: Service
metadata:
  name: scaletestapp-service
spec:
  selector:
    app: scaletestapp
  ports:
    - protocol: TCP
      port: 8080 # Порт сервиса
      targetPort: 8080 # Порт контейнера
  type: NodePort # Доступ через NodePort (если нужен LoadBalancer, укажите type: LoadBalancer)
