type Query {
  clients(id: String!): Client
  clients_documents(id: String!): [Document!]!
  clients_relatives(id: String!): [Relative!]!
}

type Client {
  id: String
  name: String
  age: Int
}

type Document {
  id: String
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: String
  relationType: String
  name: String
  age: Int
}
